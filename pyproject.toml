[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tune-subsonic"
version = "0.1.0"
description = "A small, session-based CLI music client for Subsonic servers"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tune contributors" }]
dependencies = []

[project.scripts]
tune = "tune.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
